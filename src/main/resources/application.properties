spring.application.name=huari
spring.profiles.active=dev

# Admin inicial (opcional): só é criado se ADMIN_EMAIL e ADMIN_SENHA estiverem definidos
app.admin.nome=${ADMIN_NOME:Administrador}
app.admin.email=${ADMIN_EMAIL:}
app.admin.senha=${ADMIN_SENHA:}

# Evita consultas lazy fora do service (os controllers só devolvem DTOs)
spring.jpa.open-in-view=false

# Origens do front-end permitidas pelo CORS (separadas por vírgula)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Evita N+1 nas listagens (carrega relações lazy em lotes)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Paginação: padrão de 20 itens, máximo de 100 por página
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Segredo padrão para desenvolvimento local caso nenhum perfil seja informado
app.jwt.secret=${JWT_SECRET:minha-chave-secreta-de-desenvolvimento-com-pelo-menos-32-caracteres}

# Integração com API de IA (Google Gemini)
app.ia.enabled=${IA_ENABLED:false}
app.ia.base-url=https://generativelanguage.googleapis.com
app.ia.api-key=${IA_API_KEY:sua_chave_aqui}
app.ia.model=${IA_MODEL:gemini-1.5-flash}

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Integracao com Dados Abertos do Tribunal de Contas (TCU / TCE)
app.audit-court.base-url=https://dadosabertos.tcu.gov.br/api
app.audit-court.connect-timeout-seconds=5
app.audit-court.read-timeout-seconds=15
