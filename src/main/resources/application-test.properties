# Banco em memória, isolado do MySQL local
spring.datasource.url=jdbc:h2:mem:huaritest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Admin inicial desativado nos testes
app.admin.nome=Admin Teste
app.admin.email=
app.admin.senha=

# IA desativada (o bean iaRestClient não é criado)
app.ia.enabled=false
app.ia.base-url=http://localhost
app.ia.api-key=

# CORS
app.cors.allowed-origins=http://localhost:3000
