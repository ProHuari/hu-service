spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# validate só confere se o banco bate com as entidades (não altera nada)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.cors.allowed-origins=${CORS_ORIGINS}

# Desliga a documentação em produção
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.com.huariservice.huariia=INFO

# Chave do JWT: vem só de variável de ambiente, sem valor padrão.
# Se JWT_SECRET não existir, a aplicação não sobe (de propósito).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60
