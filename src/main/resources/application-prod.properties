server.port=${PORT:8080}

spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:huari}?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo}}
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}}

# Em nuvem (Railway/Render), update inicializa/atualiza o schema automaticamente; pode ser alterado via DDL_AUTO=validate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}}

# Desliga a documentação em produção (pode ser habilitada via SWAGGER_ENABLED=true)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

logging.level.com.huariservice.huariia=INFO

# Chave do JWT: vem só de variável de ambiente, sem valor padrão.
# Se JWT_SECRET não existir, a aplicação não sobe (de propósito).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
