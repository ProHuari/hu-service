# Banco local (ajuste o nome do banco se for diferente)
spring.datasource.url=jdbc:mysql://localhost:3306/huariia?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# update cria/ajusta tabelas sozinho (só para desenvolvimento)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.huariservice.huariia=DEBUG