spring.datasource.url=jdbc:mysql://localhost:3306/huari?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:chave-de-desenvolvimento-troque-em-producao-minimo-32-caracteres}
app.jwt.expiration-minutes=60

logging.level.com.huariservice.huariia=DEBUG
